<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Admin Panel</title>
<style>
html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial;background:linear-gradient(180deg,#071029 0%,#071827 60%);color:white;display:flex;justify-content:center;align-items:flex-start;padding:16px;box-sizing:border-box}
.app{width:100%;max-width:900px;min-width:320px;background:rgba(255,255,255,0.03);border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);position:relative;box-sizing:border-box}
h1{margin:0 0 10px 0;font-size:20px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid rgba(255,255,255,0.2);padding:8px;text-align:left;font-size:14px}
th{background:rgba(255,255,255,0.05)}
button{padding:6px 10px;font-size:13px;border:none;border-radius:6px;margin:2px;cursor:pointer;transition:0.2s}
.block-btn{background:#f59e0b;color:#042027}
.delete-btn{background:#ef4444;color:#fff}
.clear-btn{background:#dc2626;color:#fff;margin-top:10px;padding:10px 16px;font-weight:600}
</style>
</head>
<body>
<div class="app">
<h1>Admin Panel — ข้อความทั้งหมด</h1>
<table id="msgTable">
<thead><tr><th>ชื่อ</th><th>ข้อความ</th><th>เวลา</th><th>Device</th><th>Action</th></tr></thead>
<tbody></tbody>
</table>
<button class="clear-btn" id="clearAll">ล้างทั้งหมด</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5DOlMXP9IedzosXcFls3kvbvdKyQGjGk",
  authDomain: "project-901413547666359240.firebaseapp.com",
  databaseURL: "https://project-901413547666359240-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "project-901413547666359240",
  storageBucket: "project-901413547666359240.firebasestorage.app",
  messagingSenderId: "321646066089",
  appId: "1:321646066089:web:9f565ce9ca38d5516c6cb8",
  measurementId: "G-8SQYEJ2MHD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const msgRef = ref(db, "messages");

const tableBody = document.querySelector('#msgTable tbody');
const clearAll = document.getElementById('clearAll');

function renderTable(data){
  tableBody.innerHTML='';
  for(const key in data){
    const m = data[key];
    const tr = document.createElement('tr');
    tr.innerHTML=`<td>${m.name||'Anonymous'}</td>
                  <td>${m.text}</td>
                  <td>${new Date(m.t).toLocaleString()}</td>
                  <td>${m.device||''}</td>
                  <td>
                    <button class="delete-btn">ลบ</button>
                    <button class="block-btn">บล็อก</button>
                  </td>`;
    tableBody.appendChild(tr);

    tr.querySelector('.delete-btn').addEventListener('click', ()=>{ remove(ref(db,"messages/"+key)); });
    tr.querySelector('.block-btn').addEventListener('click', ()=>{ alert('บล็อกชื่อ: '+(m.name||'Anonymous')); });
  }
}

onValue(msgRef, snapshot=>{ const data = snapshot.val(); if(data) renderTable(data); else tableBody.innerHTML=''; });

clearAll.addEventListener('click', ()=>{ if(confirm('ลบข้อความทั้งหมด?')) remove(msgRef); });
</script>
</body>
</html>
