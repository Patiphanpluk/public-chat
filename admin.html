<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>แอดมินกระดานข้อความ</title>
<style>
body{margin:0;padding:0;font-family:Inter, system-ui, -apple-system,"Segoe UI",Roboto,Noto Sans,Helvetica,Arial;background:linear-gradient(180deg,#071029 0%,#071827 60%);color:white}
.app{width:90%;max-width:900px;margin:20px auto;padding:16px;background:rgba(255,255,255,0.03);border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
h1{margin:0 0 12px;font-size:20px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid rgba(255,255,255,0.2);padding:6px 8px;text-align:left;font-size:13px;color:white}
th{background:rgba(255,255,255,0.05)}
button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.block{background:#ef4444;color:white;margin-right:4px;}
.deleteAll{background:#ef4444;color:white;margin-top:12px;}
</style>
</head>
<body>
<div class="app">
<h1>Admin Dashboard</h1>
<table>
<thead><tr><th>เวลา</th><th>ชื่อ</th><th>ข้อความ</th><th>Action</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<button class="deleteAll" onclick="deleteAll()">ล้างทั้งหมด</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5DOlMXP9IedzosXcFls3kvbvdKyQGjGk",
  authDomain: "project-901413547666359240.firebaseapp.com",
  databaseURL: "https://project-901413547666359240-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "project-901413547666359240",
  storageBucket: "project-901413547666359240.firebasestorage.app",
  messagingSenderId: "321646066089",
  appId: "1:321646066089:web:9f565ce9ca38d5516c6cb8",
  measurementId: "G-8SQYEJ2MHD"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const msgRef = ref(db,"messages");
const tbody = document.getElementById('tbody');

onValue(msgRef,snapshot=>{
  const data = snapshot.val();
  tbody.innerHTML='';
  if(data){
    Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([key,val])=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${new Date(val.t).toLocaleString()}</td>
                      <td>${val.name||'Anonymous'}</td>
                      <td>${val.text}</td>
                      <td><button class="block" onclick="deleteMessage('${key}')">ลบ</button></td>`;
      tbody.appendChild(tr);
    });
  }
});

window.deleteMessage = function(key){remove(ref(db,'messages/'+key));}
window.deleteAll = function(){remove(msgRef);}
</script>
</body>
</html>
