<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>กระดานข้อความสาธารณะ</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // ✅ Firebase config ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyA5DOlMXP9IedzosXcFls3kvbvdKyQGjGk",
      authDomain: "project-901413547666359240.firebaseapp.com",
      projectId: "project-901413547666359240",
      storageBucket: "project-901413547666359240.firebasestorage.app",
      messagingSenderId: "321646066089",
      appId: "1:321646066089:web:9f565ce9ca38d5516c6cb8",
      measurementId: "G-8SQYEJ2MHD",
      databaseURL: "https://project-901413547666359240-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const msgRef = ref(db, "messages");

    const feed = document.getElementById('feed');
    const nameInput = document.getElementById('name');
    const txt = document.getElementById('txt');
    const send = document.getElementById('send');

    // โหลดข้อความจาก Firebase (แบบเรียลไทม์)
    onValue(query(msgRef, limitToLast(20)), (snapshot) => {
      const data = snapshot.val();
      feed.innerHTML = '';
      if (data) {
        const msgs = Object.values(data).reverse();
        msgs.forEach((m, i) => {
          const el = document.createElement('div');
          el.className = 'message';
          el.style.top = (i * 72 + 8) + 'px';
          el.innerHTML = `
            <div class="meta">${m.name || 'Anonymous'} • ${new Date(m.t).toLocaleString()}</div>
            <div class="text">${escapeHtml(m.text)}</div>`;
          feed.appendChild(el);
        });
      }
    });

    // ส่งข้อความไป Firebase
    send.onclick = () => {
      const name = nameInput.value.trim() || 'Anonymous';
      const text = txt.value.trim();
      if (!text) return;
      push(msgRef, { name, text, t: Date.now() });
      txt.value = '';
    };

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;')
              .replace(/</g,'&lt;')
              .replace(/>/g,'&gt;')
              .replace(/\"/g,'&quot;')
              .replace(/'/g,'&#39;');
    }
  </script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: "Prompt", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .app { max-width: 600px; width: 100%; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; }
    .feed { position: relative; height: 400px; overflow: hidden; margin-top: 14px; }
    .message { position: absolute; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; margin-bottom: 6px; animation: floatUp 0.6s ease-out; }
    .meta { font-size: 12px; color: #a3a3a3; margin-bottom: 4px; }
    .text { font-size: 15px; }
    textarea, input { width: 100%; padding: 8px; margin-top: 8px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: white; }
    button { margin-top: 8px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #06b6d4; color: #042027; font-weight: bold; cursor: pointer; }
    @keyframes floatUp {
      from { transform: translateX(-50%) translateY(30px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>🌐 กระดานข้อความสาธารณะ</h2>
    <input id="name" placeholder="ชื่อของคุณ (ไม่บังคับ)">
    <textarea id="txt" placeholder="พิมพ์ข้อความที่นี่..."></textarea>
    <button id="send">ส่งข้อความ</button>
    <div class="feed" id="feed"></div>
  </div>
</body>
</html>
