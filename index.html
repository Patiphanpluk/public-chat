<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>กระดานข้อความ</title>
<style>
body {
  margin:0;
  padding:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(180deg,#071029 0%,#071827 60%);
  font-family:Inter, system-ui, -apple-system,"Segoe UI", Roboto, "Noto Sans", Helvetica, Arial;
}
.container {
  display:flex;
  flex-direction:column;
  gap:24px;
  align-items:center;
}
button {
  padding:14px 28px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  color:#042027;
  background:#06b6d4;
  transition:0.2s;
}
button:hover {opacity:0.85;}
</style>
</head>
<body>
<div class="container">
  <button onclick="window.open('public.html','_blank')">กระดานสาธารณะ</button>
  <button onclick="window.open('admin.html','_blank')">หน้าแอดมิน</button>
</div>
</body>
</html>
