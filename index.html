<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>เลือกกระดานข้อความ</title>
<style>
html,body{height:100%;margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;background:#071029;color:white}
.home-buttons{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.home-buttons button{flex:1;max-width:220px;padding:12px 18px;background:#06b6d4;border:0;border-radius:10px;color:#042027;font-weight:600;cursor:pointer;font-size:16px;}
</style>
</head>
<body>
<div class="home-buttons">
  <button id="public-btn">Public Board</button>
  <button id="admin-btn">Admin</button>
</div>

<script>
const publicBtn = document.getElementById('public-btn');
const adminBtn = document.getElementById('admin-btn');

publicBtn.addEventListener('click', ()=>{
  window.open('public.html','_blank');
});

adminBtn.addEventListener('click', ()=>{
  window.location.href='admin.html';
});
</script>
</body>
</html>
